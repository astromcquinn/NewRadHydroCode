# Nightly label (full-loop references, pool guard, full hydro tiers, the
# Stromgren and recombination checks): about 5 minutes each, run once a day
# on main and on demand. Same toolchain pin as ci.yml.
name: Nightly

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC daily (02:17 Pacific)
  workflow_dispatch:

jobs:
  nightly-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            g++ gfortran cmake ninja-build libfftw3-dev \
            python3 python3-numpy python3-matplotlib

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRADRAY_NIGHTLY_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Nightly suite
        run: |
          ulimit -s unlimited
          ctest --test-dir build -j4 -L nightly --output-on-failure --timeout 7200

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-nightly-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
