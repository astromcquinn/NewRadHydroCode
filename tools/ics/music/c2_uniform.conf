# The C26 box (docs/zoom_turbulence.md section 3b): 0.25 Mpc/h, uniform,
# 1024^3 gas and dark matter (244 pc/h), z = 300, separate baryon and CDM
# transfer functions from CAMB (tools/ics/music/camb_transfer.py, at
# zstart), 1LPT (user decision), Planck-like cosmology of Cain et al. 2026.
# The C1 ladder: levelmin = levelmin_TF = levelmax = 6, 7, 8, 9 (64^3 to
# 512^3) with the same seed[10]: MUSIC's hierarchical generator keeps the
# modes of the coarser runs when the seed is given at the finest level
# used by every run (seed[10] here), so the ladder shares its large scales.
[setup]
boxlength   = 0.25
zstart      = 300
levelmin    = 10
levelmin_TF = 10
levelmax    = 10
padding     = 8
overlap     = 4
align_top   = no
baryons     = yes
use_2LPT    = no

[cosmology]
Omega_m       = 0.305
Omega_L       = 0.695
Omega_b       = 0.048
H0            = 68.0
sigma_8       = 0.82
n_s           = 0.9667
transfer      = camb_file
transfer_file = camb_z300.dat

[random]
seed[10] = 2026

[output]
format   = generic
filename = c2_1024.hdf5

[poisson]
fft_fine      = yes
accuracy      = 1e-5
grad_order    = 6
laplace_order = 6
