# The Z3 zoom (docs/zoom_turbulence.md section 3): the 40 Mpc/h base at
# level 9 (512^3, 78 kpc/h) refined to level 17 (8 levels, 0.305 kpc/h)
# over a region of 0.3125 Mpc/h (1024^3 fine cells) around ref_center
# (box units; from the base run's chosen region, traced back to the ICs,
# plus a pad: section 3). Z1 = levelmax 13, Z2 = levelmax 15 with the
# same seeds: the ladder property. Memory: the level-17 region with its
# padding is ~1200^3 cells of double per field; run on a whole node.
[setup]
boxlength   = 40
zstart      = 300
levelmin    = 9
levelmin_TF = 9
levelmax    = 17
padding     = 8
overlap     = 4
ref_center  = 0.5, 0.5, 0.5
ref_extent  = 0.0078125, 0.0078125, 0.0078125   # 0.3125 / 40
align_top   = no
baryons     = yes
use_2LPT    = no

[cosmology]
Omega_m       = 0.305
Omega_L       = 0.695
Omega_b       = 0.048
H0            = 68.0
sigma_8       = 0.82
n_s           = 0.9667
transfer      = camb_file
transfer_file = camb_z300.dat

[random]
seed[9]  = 2026
seed[10] = 3026
seed[11] = 4026
seed[12] = 5026
seed[13] = 6026
seed[14] = 7026
seed[15] = 8026
seed[16] = 9026
seed[17] = 10026

[output]
format   = generic
filename = zoom_z3.hdf5

[poisson]
fft_fine      = yes
accuracy      = 1e-5
grad_order    = 6
laplace_order = 6
