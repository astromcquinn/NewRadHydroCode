# MUSIC smoke test: a uniform 0.25 Mpc/h box at 32^3 with baryons, the
# Eisenstein-Hu transfer function, the generic (HDF5) output. Runs in
# seconds; checks the build (tools/hyak/setup_music.sh).
[setup]
boxlength   = 0.25        # Mpc/h
zstart      = 300
levelmin    = 5           # 2^5 = 32 cells
levelmin_TF = 5
levelmax    = 5
padding     = 8
overlap     = 4
align_top   = no
baryons     = yes
use_2LPT    = no

[cosmology]
Omega_m  = 0.305
Omega_L  = 0.695
Omega_b  = 0.048
H0       = 68.0
sigma_8  = 0.82
n_s      = 0.9667
transfer = eisenstein

[random]
seed[5] = 12345

[output]
format   = generic
filename = test32.hdf5

[poisson]
fft_fine      = yes
accuracy      = 1e-5
grad_order    = 6
laplace_order = 6
